name: Auto-Update PWA Version Timestamp

on:
  push:
    branches:
      - main # Change this to 'master' if your main branch uses that name
    paths:
      - 'public/data.json' # Triggers ONLY when your rulebook data changes

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push the update back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Timestamp and Update version.json
        run: |
          # Generate an ISO timestamp (e.g., 2026-10-21T15:44:00Z)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Write the JSON payload directly into your public folder
          echo "{\"version\": \"$TIMESTAMP\"}" > public/version.json
          
          echo "Updated version.json with timestamp: $TIMESTAMP"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add public/version.json
          
          # Only commit if the version file actually changed
          git diff-index --quiet HEAD || git commit -m "chore: auto-update PWA version timestamp [skip ci]"
          git push